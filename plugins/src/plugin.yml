name: CitadelleMessages
version: 1.3.0
main: fr.citadelle.messages.CitadelleMessages
api-version: '1.21'
description: Faille temporelle + Regeneration a la mort + faux messages d'arrivee/depart stylises quand le staff passe en vanish (Staff++).
author: La Citadelle
softdepend: [PlaceholderAPI, StaffPlusPlus, LuckPerms, Factions]
commands:
  faille:
    description: Infos sur la faille temporelle (start/stop/tp/reload pour le staff).
    usage: /faille [info|start [ici]|stop|tp|reload]
    aliases: [rift]
permissions:
  citadelle.faille.admin:
    description: Lancer, arreter et configurer la faille temporelle.
    default: op
