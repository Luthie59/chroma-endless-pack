name: CitadelleMessages
version: 1.9.1
main: fr.citadelle.messages.CitadelleMessages
api-version: '1.21'
description: Faille temporelle + Regeneration a la mort + faux messages d'arrivee/depart stylises quand le staff passe en vanish (Staff++).
author: La Citadelle
softdepend: [PlaceholderAPI, StaffPlusPlus, LuckPerms, Factions]
commands:
  faille:
    description: Infos sur la faille temporelle (start/stop/tp/reload pour le staff).
    usage: /faille [info|start [ici]|stop|tp|reload]
    aliases: [rift]
  chronon:
    description: Echanger ses fragments de chronon aupres de l'Horloger (pnj/donner/reload pour le staff).
    usage: /chronon [pnj [retirer] | donner <joueur> <n> | reload]
    aliases: [chronons, echange, horloger]
  maisons:
    description: Classement des Grandes Maisons (place/retirer/reset/reload pour le staff).
    usage: /maisons [place | retirer | reset | reload]
    aliases: [classement, grandesmaisons]
  quetes:
    description: Le registre de l'Archiviste (quetes du jour et de la semaine).
    usage: /quetes [pnj [retirer] | reset <joueur> | reload]
    aliases: [quete, quests, archiviste]
  amitie:
    description: L'Instant Eternel.
    usage: /amitie [definir | statues [hauteur]]
permissions:
  citadelle.amitie:
    description: Acces a l'Instant Eternel (donne joueur par joueur).
    default: false
  citadelle.quetes.admin:
    description: Placer l'Archiviste, remettre les quetes d'un joueur a zero, recharger.
    default: op
  citadelle.maisons.admin:
    description: Placer le classement des Grandes Maisons et remettre les victoires a zero.
    default: op
  citadelle.chronon.admin:
    description: Placer l'Horloger, donner des fragments, recharger les offres.
    default: op
  citadelle.faille.admin:
    description: Lancer, arreter et configurer la faille temporelle.
    default: op
