# Messages envoyes a tout le serveur quand un membre du staff passe en vanish (/v ou /staff).
# {player} = pseudo, les placeholders PlaceholderAPI sont acceptes (ex : %luckperms_prefix%).
# Couleurs : codes & et &#RRGGBB.
fake-quit: "&8[&c-&8] %luckperms_prefix%{player} &7a quitté la Citadelle"
fake-join: "&8[&a+&8] %luckperms_prefix%{player} &7est arrivé dans la Citadelle"

# Regeneration : effet dore a la mort, prefixe du message de mort, titre + spirale au retour.
regeneration:
  enabled: true
  death-prefix: "&f &8» "
  title: "&6&l✦ Régénération ✦"
  subtitle: "&eUne nouvelle incarnation commence…"
  # Secondes de Regeneration I offertes au retour (0 = aucune).
  regen-seconds: 5

# Faille temporelle : event PvP. Une faille s'ouvre loin du spawn, les factions se battent pour la tenir.
faille:
  enabled: true
  world: world
  # Ouvertures automatiques (heure de Paris), seulement s'il y a assez de joueurs connectes.
  auto: true
  timezone: Europe/Paris
  times: ["15:00", "18:00", "21:00"]
  min-players: 2
  # Distance du spawn (0,0) ou la faille peut apparaitre (hors claims, hors eau).
  min-distance: 600
  max-distance: 1800
  # Temps pour s'y rendre apres l'annonce, duree max, et temps de controle pour gagner (secondes).
  warmup-seconds: 300
  max-duration-seconds: 1200
  capture-seconds: 180
  radius: 6
  # Vagues d'echos temporels (seulement si des joueurs sont proches).
  wave-interval-seconds: 45
  max-mobs: 18
  # Commandes console pour chaque joueur gagnant ayant tenu la zone >= 30 s ({player}, {faction}).
  reward-commands:
    - "eco give {player} 5000"
  # Commandes pour les joueurs des AUTRES factions qui se sont battus >= 30 s dans la zone.
  participation-commands:
    - "eco give {player} 750"
  # Coffre du temps : reserve aux gagnants pendant chest-protection-seconds, disparait apres chest-lifetime-seconds.
  chest-protection-seconds: 60
  chest-lifetime-seconds: 300
  # "MATERIAU min-max chance%". Speciaux : CHRONON (fragment de chronon), RELIC (relique temporelle :
  # arme/armure/outil legendaire enchante), ENCHANTED_BOOK:<enchantement>[:niveau] (niveau max par defaut).
  loot:
    - "RELIC 1 100"
    - "RELIC 1 25"
    - "DIAMOND 8-16 100"
    - "NETHERITE_INGOT 1-2 45"
    - "NETHERITE_SCRAP 2-4 70"
    - "ENCHANTED_GOLDEN_APPLE 1-2 40"
    - "GOLDEN_APPLE 6-12 100"
    - "TOTEM_OF_UNDYING 1-2 50"
    - "ENCHANTED_BOOK:mending 1 50"
    - "ENCHANTED_BOOK:sharpness 1 40"
    - "ENCHANTED_BOOK:protection 1 40"
    - "ENCHANTED_BOOK:efficiency 1 30"
    - "ENCHANTED_BOOK:unbreaking 1 30"
    - "EMERALD_BLOCK 3-6 80"
    - "EXPERIENCE_BOTTLE 24-48 100"
    - "ENDER_PEARL 8-16 90"
    - "SHULKER_BOX 1 25"
    - "ELYTRA 1 6"
    - "CHRONON 10-20 100"

# Echange de fragments de chronon aupres de l'Horloger (/chronon ou clic droit sur le PNJ).
# Emplacements dores du fond : 10 a 16 (ligne du haut) et 28, 30, 32, 34 (ligne du bas).
# donne : objets ("MATERIAU quantite", CHRONON, RELIC, ENCHANTED_BOOK:enchantement[:niveau]).
# commandes : commandes console ({player}). Le PNJ se place avec /chronon pnj.
chronons:
  offres:
    xp:
      slot: 10
      prix: 4
      icone: EXPERIENCE_BOTTLE
      nom: "&a16 fioles d'expérience"
      donne: ["EXPERIENCE_BOTTLE 16"]
    perles:
      slot: 11
      prix: 5
      icone: ENDER_PEARL
      nom: "&38 perles de l'Ender"
      donne: ["ENDER_PEARL 8"]
    pommes:
      slot: 12
      prix: 6
      icone: GOLDEN_APPLE
      nom: "&64 pommes dorées"
      donne: ["GOLDEN_APPLE 4"]
    argent:
      slot: 13
      prix: 8
      icone: GOLD_INGOT
      nom: "&e1 000 $"
      description: ["&7Le temps, c'est de l'argent."]
      commandes: ["eco give {player} 1000"]
    totem:
      slot: 14
      prix: 15
      icone: TOTEM_OF_UNDYING
      nom: "&eTotem d'immortalité"
      donne: ["TOTEM_OF_UNDYING 1"]
    raccommodage:
      slot: 15
      prix: 20
      icone: ENCHANTED_BOOK
      nom: "&dLivre : Raccommodage"
      donne: ["ENCHANTED_BOOK:mending"]
    netherite:
      slot: 16
      prix: 25
      icone: NETHERITE_INGOT
      nom: "&8Lingot de netherite"
      donne: ["NETHERITE_INGOT 1"]
    pomme_enchantee:
      slot: 28
      prix: 30
      icone: ENCHANTED_GOLDEN_APPLE
      nom: "&6&lPomme dorée enchantée"
      donne: ["ENCHANTED_GOLDEN_APPLE 1"]
    shulker:
      slot: 30
      prix: 35
      icone: SHULKER_BOX
      nom: "&5Boîte de Shulker"
      donne: ["SHULKER_BOX 1"]
    relique:
      slot: 32
      prix: 60
      icone: NETHERITE_SWORD
      nom: "&6&l✦ Relique temporelle"
      description: ["&7Une relique légendaire au hasard :", "&7Lame du Gardien, Arc de la Sentinelle,", "&7Couronne du Seigneur du Temps…"]
      donne: ["RELIC"]
    elytres:
      slot: 34
      prix: 90
      icone: ELYTRA
      nom: "&b&lÉlytres"
      description: ["&7Pour voler entre les époques."]
      donne: ["ELYTRA 1"]
