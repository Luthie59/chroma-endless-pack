# Messages envoyes a tout le serveur quand un membre du staff passe en vanish (/v ou /staff).
# {player} = pseudo, les placeholders PlaceholderAPI sont acceptes (ex : %luckperms_prefix%).
# Couleurs : codes & et &#RRGGBB.
fake-quit: "&8[&c-&8] %luckperms_prefix%{player} &7a quitté la Citadelle"
fake-join: "&8[&a+&8] %luckperms_prefix%{player} &7est arrivé dans la Citadelle"

# Regeneration : effet dore a la mort, prefixe du message de mort, titre + spirale au retour.
regeneration:
  enabled: true
  death-prefix: "&f &8» "
  title: "&6&l✦ Régénération ✦"
  subtitle: "&eUne nouvelle incarnation commence…"
  # Secondes de Regeneration I offertes au retour (0 = aucune).
  regen-seconds: 5

# Faille temporelle : event PvP. Une faille s'ouvre loin du spawn, les factions se battent pour la tenir.
faille:
  enabled: true
  world: world
  # Ouvertures automatiques (heure de Paris), seulement s'il y a assez de joueurs connectes.
  auto: true
  timezone: Europe/Paris
  times: ["15:00", "18:00", "21:00"]
  min-players: 2
  # Distance du spawn (0,0) ou la faille peut apparaitre (hors claims, hors eau).
  min-distance: 600
  max-distance: 1800
  # Temps pour s'y rendre apres l'annonce, duree max, et temps de controle pour gagner (secondes).
  warmup-seconds: 300
  max-duration-seconds: 1200
  capture-seconds: 180
  radius: 6
  # Vagues d'echos temporels (seulement si des joueurs sont proches).
  wave-interval-seconds: 45
  max-mobs: 18
  # Commandes console pour chaque joueur gagnant ayant tenu la zone >= 30 s ({player}, {faction}).
  reward-commands:
    - "eco give {player} 5000"
  # Commandes pour les joueurs des AUTRES factions qui se sont battus >= 30 s dans la zone.
  participation-commands:
    - "eco give {player} 750"
  # Coffre du temps : reserve aux gagnants pendant chest-protection-seconds, disparait apres chest-lifetime-seconds.
  chest-protection-seconds: 60
  chest-lifetime-seconds: 300
  # "MATERIAU min-max chance%". Speciaux : CHRONON (fragment de chronon), RELIC (relique temporelle :
  # arme/armure/outil legendaire enchante), ENCHANTED_BOOK:<enchantement>[:niveau] (niveau max par defaut).
  loot:
    - "RELIC 1 100"
    - "RELIC 1 25"
    - "DIAMOND 8-16 100"
    - "NETHERITE_INGOT 1-2 45"
    - "NETHERITE_SCRAP 2-4 70"
    - "ENCHANTED_GOLDEN_APPLE 1-2 40"
    - "GOLDEN_APPLE 6-12 100"
    - "TOTEM_OF_UNDYING 1-2 50"
    - "ENCHANTED_BOOK:mending 1 50"
    - "ENCHANTED_BOOK:sharpness 1 40"
    - "ENCHANTED_BOOK:protection 1 40"
    - "ENCHANTED_BOOK:efficiency 1 30"
    - "ENCHANTED_BOOK:unbreaking 1 30"
    - "EMERALD_BLOCK 3-6 80"
    - "EXPERIENCE_BOTTLE 24-48 100"
    - "ENDER_PEARL 8-16 90"
    - "SHULKER_BOX 1 25"
    - "ELYTRA 1 6"
    - "CHRONON 10-20 100"

# Echange de fragments de chronon aupres de l'Horloger (/chronon ou clic droit sur le PNJ).
# Emplacements dores du fond : 10 a 16 (ligne du haut) et 28, 30, 32, 34 (ligne du bas).
# donne : objets ("MATERIAU quantite", CHRONON, RELIC, ENCHANTED_BOOK:enchantement[:niveau]).
# commandes : commandes console ({player}). Le PNJ se place avec /chronon pnj.
chronons:
  offres:
    xp:
      slot: 10
      prix: 4
      icone: EXPERIENCE_BOTTLE
      nom: "&a16 fioles d'expérience"
      donne: ["EXPERIENCE_BOTTLE 16"]
    perles:
      slot: 11
      prix: 5
      icone: ENDER_PEARL
      nom: "&38 perles de l'Ender"
      donne: ["ENDER_PEARL 8"]
    pommes:
      slot: 12
      prix: 6
      icone: GOLDEN_APPLE
      nom: "&64 pommes dorées"
      donne: ["GOLDEN_APPLE 4"]
    argent:
      slot: 13
      prix: 8
      icone: GOLD_INGOT
      nom: "&e1 000 $"
      description: ["&7Le temps, c'est de l'argent."]
      commandes: ["eco give {player} 1000"]
    totem:
      slot: 14
      prix: 15
      icone: TOTEM_OF_UNDYING
      nom: "&eTotem d'immortalité"
      donne: ["TOTEM_OF_UNDYING 1"]
    raccommodage:
      slot: 15
      prix: 20
      icone: ENCHANTED_BOOK
      nom: "&dLivre : Raccommodage"
      donne: ["ENCHANTED_BOOK:mending"]
    netherite:
      slot: 16
      prix: 25
      icone: NETHERITE_INGOT
      nom: "&8Lingot de netherite"
      donne: ["NETHERITE_INGOT 1"]
    pomme_enchantee:
      slot: 28
      prix: 30
      icone: ENCHANTED_GOLDEN_APPLE
      nom: "&6&lPomme dorée enchantée"
      donne: ["ENCHANTED_GOLDEN_APPLE 1"]
    shulker:
      slot: 30
      prix: 35
      icone: SHULKER_BOX
      nom: "&5Boîte de Shulker"
      donne: ["SHULKER_BOX 1"]
    relique:
      slot: 32
      prix: 60
      icone: NETHERITE_SWORD
      nom: "&6&l✦ Relique temporelle"
      description: ["&7Une relique légendaire au hasard :", "&7Lame du Gardien, Arc de la Sentinelle,", "&7Couronne du Seigneur du Temps…"]
      donne: ["RELIC"]
    elytres:
      slot: 34
      prix: 90
      icone: ELYTRA
      nom: "&b&lÉlytres"
      description: ["&7Pour voler entre les époques."]
      donne: ["ELYTRA 1"]

# Les Grandes Maisons : classement des factions (hologramme au spawn + /maisons).
# Prestige = power x power + terres x terres + failles x victoires de faille. /maisons place pour l'installer.
maisons:
  top: 5
  refresh-seconds: 60
  prestige:
    power: 1
    terres: 2
    failles: 25

# L'Archiviste : quetes quotidiennes (5 max) et hebdomadaires (2 max), tirees au hasard pour chaque joueur.
# types : TUER (cibles : HOSTILE, ANY ou types d'entite), TUER_JOUEUR, MINER / RECOLTER (cibles : blocs ou #tag),
#         PECHER, FAILLE_PARTICIPER, FAILLE_GAGNER. Recompenses : chronons (fragments), argent, commandes ({player}).
# Le PNJ se place avec /quetes pnj.
archiviste:
  timezone: Europe/Paris
  quotidiennes: 5
  hebdomadaires: 2
  bonus-jour:
    chronons: 5
    argent: 1000
  bonus-semaine:
    chronons: 25
    argent: 5000
  quetes:
    chasseur:
      periode: jour
      type: TUER
      cibles: [HOSTILE]
      nombre: 40
      nom: "Chasseur d'ombres"
      objectif: "Terrasse 40 monstres."
      icone: IRON_SWORD
      chronons: 2
      argent: 300
    zombies:
      periode: jour
      type: TUER
      cibles: [ZOMBIE, HUSK, DROWNED, ZOMBIE_VILLAGER]
      nombre: 20
      nom: "Les morts qui marchent"
      objectif: "Élimine 20 zombies."
      icone: ROTTEN_FLESH
      chronons: 2
      argent: 250
    squelettes:
      periode: jour
      type: TUER
      cibles: [SKELETON, STRAY, BOGGED]
      nombre: 15
      nom: "Os brisés"
      objectif: "Élimine 15 squelettes."
      icone: BONE
      chronons: 2
      argent: 250
    creepers:
      periode: jour
      type: TUER
      cibles: [CREEPER]
      nombre: 8
      nom: "Désamorçage"
      objectif: "Élimine 8 creepers."
      icone: GUNPOWDER
      chronons: 2
      argent: 300
    araignees:
      periode: jour
      type: TUER
      cibles: [SPIDER, CAVE_SPIDER]
      nombre: 15
      nom: "Toiles du temps"
      objectif: "Élimine 15 araignées."
      icone: STRING
      chronons: 2
      argent: 250
    charbon:
      periode: jour
      type: MINER
      cibles: [COAL_ORE, DEEPSLATE_COAL_ORE]
      nombre: 48
      nom: "Combustible"
      objectif: "Mine 48 minerais de charbon."
      icone: COAL
      chronons: 2
      argent: 250
    fer:
      periode: jour
      type: MINER
      cibles: [IRON_ORE, DEEPSLATE_IRON_ORE]
      nombre: 32
      nom: "Âge du fer"
      objectif: "Mine 32 minerais de fer."
      icone: RAW_IRON
      chronons: 3
      argent: 350
    diamants:
      periode: jour
      type: MINER
      cibles: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE]
      nombre: 6
      nom: "Éclats d'éternité"
      objectif: "Mine 6 minerais de diamant."
      icone: DIAMOND
      chronons: 4
      argent: 500
    pierre:
      periode: jour
      type: MINER
      cibles: [STONE, DEEPSLATE, COBBLESTONE, ANDESITE, DIORITE, GRANITE, TUFF]
      nombre: 256
      nom: "Tailleur de pierre"
      objectif: "Mine 256 blocs de pierre."
      icone: STONE_PICKAXE
      chronons: 2
      argent: 250
    bucheron:
      periode: jour
      type: MINER
      cibles: ["#LOGS"]
      nombre: 64
      nom: "Bûcheron"
      objectif: "Coupe 64 bûches."
      icone: IRON_AXE
      chronons: 2
      argent: 250
    recoltes:
      periode: jour
      type: RECOLTER
      cibles: [ANY]
      nombre: 64
      nom: "Moissons"
      objectif: "Récolte 64 cultures mûres."
      icone: WHEAT
      chronons: 2
      argent: 250
    peche:
      periode: jour
      type: PECHER
      nombre: 10
      nom: "Pêcheur des époques"
      objectif: "Pêche 10 prises."
      icone: FISHING_ROD
      chronons: 2
      argent: 250
    duelliste:
      periode: jour
      type: TUER_JOUEUR
      nombre: 3
      nom: "Duelliste"
      objectif: "Vaincs 3 joueurs."
      icone: GOLDEN_SWORD
      chronons: 4
      argent: 600
    faille_participer:
      periode: semaine
      type: FAILLE_PARTICIPER
      nombre: 2
      nom: "Voyageur des failles"
      objectif: "Combats dans 2 failles temporelles (30 s dans la zone)."
      icone: RECOVERY_COMPASS
      chronons: 15
      argent: 2500
    faille_gagner:
      periode: semaine
      type: FAILLE_GAGNER
      nombre: 1
      nom: "Maître du temps"
      objectif: "Remporte une faille temporelle."
      icone: NETHER_STAR
      chronons: 25
      argent: 4000
    exterminateur:
      periode: semaine
      type: TUER
      cibles: [HOSTILE]
      nombre: 300
      nom: "Exterminateur"
      objectif: "Terrasse 300 monstres."
      icone: NETHERITE_SWORD
      chronons: 15
      argent: 3000
    mineur:
      periode: semaine
      type: MINER
      cibles: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE]
      nombre: 32
      nom: "Cœur de la montagne"
      objectif: "Mine 32 minerais de diamant."
      icone: DIAMOND_PICKAXE
      chronons: 15
      argent: 3000
    conquerant:
      periode: semaine
      type: TUER_JOUEUR
      nombre: 15
      nom: "Conquérant"
      objectif: "Vaincs 15 joueurs."
      icone: NETHERITE_HELMET
      chronons: 20
      argent: 4000
